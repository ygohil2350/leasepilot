services:
  mongo:
    image: mongo:7-jammy
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: [mongo-dev-data:/data/db]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongo:27017''}]}).ok }" | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ./backend, target: development }
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/leasepilot?replicaSet=rs0
      JWT_SECRET: development-only-secret-change-me-123456
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173
    ports: ['4000:4000']
    volumes:
      - ./backend:/app
      - backend-modules:/app/node_modules
    depends_on:
      mongo: { condition: service_healthy }
  web:
    build: { context: ./frontend, target: development }
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
      CHOKIDAR_USEPOLLING: 'true'
    ports: ['5173:5173']
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    depends_on: [api]
volumes:
  mongo-dev-data:
  backend-modules:
  frontend-modules:
